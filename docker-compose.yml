# 프로젝트명 고정 — 폴더명(ProjectFile→backend 등)이 바뀌어도 compose 프로젝트/볼륨/
# 컨테이너 네임스페이스가 유지되도록 한다. (기존 볼륨 kira_pgdata/kira_redisdata = 프로젝트 'projectfile')
name: projectfile

services:
  # Layer 1: 공급망 데이터 백본 (PostgreSQL + PostGIS + pgvector)
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    container_name: kira-postgres
    networks:
      - project_net
    env_file:
      - ./.env
    # ports 제거: 외부 노출 안 함. 컨테이너 내부 통신(app→db:5432)만 사용.
    # EC2에서 직접 DB 보려면 SSH 터널 사용.
    volumes:
      - kira_pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: TCP 강제. 최초 initdb 중 postgres는 소켓만 듣는 임시 서버를 띄우는데,
      # 호스트 미지정 pg_isready는 소켓으로 붙어 그 구간에도 healthy 판정 → app이 TCP 접속하다
      # 죽는 레이스가 있었다. TCP로 검사하면 진짜 서버가 뜬 뒤에만 healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-kira_admin} -d $${POSTGRES_DB:-kira_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # 최초 initdb(빈 볼륨)나 비정상 종료 후 WAL 복구는 몇십 초 걸릴 수 있는데,
      # 이 구간의 실패는 retries에 안 세고 봐준다. 이후엔 5s*5=25s 안에 진짜 장애를 감지.
      start_period: 60s
    restart: always

  # Async Workflow Queue용 Redis (ARQ)
  redis:
    image: redis:7-alpine
    container_name: kira-redis
    networks:
      - project_net
    # appendonly: 큐 저장소라 기본 RDB 스냅샷만으로는 크래시 시 마지막 스냅샷 이후
    # 큐 작업이 유실된다. AOF로 작업 단위 내구성 확보.
    command: ["redis-server", "--appendonly", "yes"]
    # ports 제거: 외부 노출 안 함. 내부 통신만.
    volumes:
      - kira_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # Layer 2: KIRA 에이전트 통합 백엔드 (FastAPI)
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    # 워커들과 같은 이미지를 태그 하나로 공유 — 서비스별 중복 태그(projectfile-app,
    # projectfile-worker-* ...) 대신 kira-backend 하나만 남는다.
    image: kira-backend
    container_name: kira-backend
    networks:
      - project_net
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # CORS .env의 ALLOWED_ORIGINS를 그대로 전달(없으면 config 기본값).
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    # ports 제거: 외부 노출 안 함. nginx가 내부에서 app:8000으로 전달.
    # volumes 제거: 이미지 안의 코드를 그대로 사용 (CI/CD 대비, 운영 정석).
    # 부팅 시: 규제 임베딩 자동 시드(멱등)를 백그라운드로 돌리고 uvicorn을 바로 기동.
    #   시드가 부팅 경로에 있으면 배포마다 그 시간만큼 502 다운타임이 늘어난다.
    #   시드는 멱등(pending만 임베딩, indexed는 스킵)이라 서빙과 병행해도 안전 —
    #   유일한 예외는 빈 DB 최초 부팅 직후 잠깐 RAG 검색이 빈약할 수 있는 정도.
    #   스키마 DDL은 docker/01_schema.sql(빈 볼륨 최초 init)로 일원화 — alembic 마이그레이션 미사용.
    #   app 컨테이너 1개에서만 실행되므로 경합 없음(워커는 arq라 미실행).
    command: ["sh", "-c", "python -m backend.infrastructure.wait_for_db || exit 1; { python -m backend.domains.regulation.embeddings & }; exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    # init: 백그라운드 시드 프로세스 좀비 회수 + 시그널 전달 (tini PID 1)
    init: true
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ─────────────────────────────────────────────────────────────
  # Layer 2: ARQ 워커들 (Queue 컨슈머) — app과 동일 이미지, command만 다름
  #
  # 큐 계약(queue.py QUEUE_NAMES) 기준, 한 큐 = 한 워커(경쟁 소비자 금지 — ARQ는
  # 미등록 함수 작업을 재시도 없이 실패 처리하므로 같은 큐에 워커 둘이면 작업 유실).
  #   - submission cron은 notification_worker에 병합 (같은 notification_queue 소비)
  #   - verification_queue / dead_letter_queue: 워커 없음 (전자는 enqueue 코드 없음,
  #     후자는 실패 작업 보관용 — 운영자가 수동 처리)
  #
  # 공통 설정은 아래 앵커(worker-build/env/deps)로 한 번만 정의하고 각 워커가 재사용.
  # ─────────────────────────────────────────────────────────────

  # document_parse_queue 워커 (문서 파싱 — 은진 Data Gateway)
  worker-parse:
    build: &worker-build
      context: .
      dockerfile: docker/app.Dockerfile
    image: kira-backend
    networks:
      - project_net
    env_file:
      - ./.env
    environment: &worker-env
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on: &worker-deps
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    container_name: kira-worker-parse
    command: ["sh", "-c", "python -m backend.infrastructure.wait_for_db && arq backend.workers.document_parse_worker.WorkerSettings"]

  # hitl_queue 워커
  worker-hitl:
    build: *worker-build
    image: kira-backend
    networks:
      - project_net
    env_file:
      - ./.env
    environment: *worker-env
    depends_on: *worker-deps
    restart: always
    container_name: kira-worker-hitl
    command: ["sh", "-c", "python -m backend.infrastructure.wait_for_db && arq backend.workers.hitl_worker.WorkerSettings"]

  # batch_pipeline_queue worker
  worker-pipeline:
    build: *worker-build
    image: kira-backend
    networks:
      - project_net
    env_file:
      - ./.env
    environment: *worker-env
    depends_on: *worker-deps
    restart: always
    container_name: kira-worker-pipeline
    command: ["sh", "-c", "python -m backend.infrastructure.wait_for_db && arq backend.workers.pipeline_worker.WorkerSettings"]

  # notification_queue 워커
  worker-notification:
    build: *worker-build
    image: kira-backend
    networks:
      - project_net
    env_file:
      - ./.env
    environment: *worker-env
    depends_on: *worker-deps
    restart: always
    container_name: kira-worker-notification
    command: ["sh", "-c", "python -m backend.infrastructure.wait_for_db && arq backend.workers.notification_worker.WorkerSettings"]


  # Layer 0: Nginx 리버스 프록시 (정문 — gzip 압축 + app 전달)
  nginx:
    image: nginx:1.27-alpine
    container_name: kira-nginx
    networks:
      - project_net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  kira_pgdata:
    name: kira_pgdata
  kira_redisdata:
    name: kira_redisdata

networks:
  project_net:
    driver: bridge
